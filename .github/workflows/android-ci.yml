name: Android CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js for Firebase emulators
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install Firebase emulator tooling
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Install Android SDK 36.1
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle without persistent cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Assemble and test against isolated Firebase emulators
        run: >-
          npx --no-install firebase emulators:exec --config firebase.ci.json
          --project demo-no-project --only auth,firestore
          './gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest'
