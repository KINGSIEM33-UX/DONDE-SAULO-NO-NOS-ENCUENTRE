name: Room migrations (Android emulator)
on:
  push:
    branches: ["cue/adora-bible-identity"]
    paths:
      - "app/src/main/java/com/example/data/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/room-migration-emulator-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle without persistent cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install Android SDK 36.1 for compilation
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run instrumented Room migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:connectedDebugAndroidTest
